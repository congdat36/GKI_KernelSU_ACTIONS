name: Build and Release GKI Kernels

permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: write   # Allows triggering actions
  
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Choose runner"
        required: true
        type: choice
        options:
          - ubuntu-22.04
          - ubuntu-local
        default: ubuntu-22.04
      lto_type:
        description: "Choose LTO type (full will not run on basic runners)"
        required: true
        type: choice
        options:
          - full
          - thin
          - none
        default: thin
      build_a12_5_10:
        description: 'Build Android 12 5.10 kernel?'
        required: true
        type: boolean
        default: true
      build_a13_5_10:
        description: 'Build Android 13 5.10 kernel?'
        required: true
        type: boolean
        default: true
      build_a13_5_15:
        description: 'Build Android 13 5.15 kernel?'
        required: true
        type: boolean
        default: true
      build_a14_5_15:
        description: 'Build Android 14 5.15 kernel?'
        required: true
        type: boolean
        default: true
      build_a14_6_1:
        description: 'Build Android 14 6.1 kernel?'
        required: true
        type: boolean
        default: true
      build_a16_6_6:
        description: 'Build Android 16 6.6 kernel for A05?'
        required: true
        type: boolean
        default: true
      next_branch:
        description: "Choose Next Branch"
        required: true
        type: choice
        options:
          - Stable
          - Dev
          - Other
        default: Stable
      next_branch_other:
        description: "If chosen other, please specify branch (optional)"
        required: false
        type: string
        default: ""

jobs:
  build-kernel-a12-5-10:
    uses: ./.github/workflows/build-kernel-a12-5.10.yml
    secrets: inherit
    if: ${{ inputs.build_a12_5_10 }}
    with:
      runner: ${{ inputs.runner }}
      lto_type: ${{ inputs.lto_type }}
      next_branch: ${{ inputs.next_branch }}
      next_branch_other: ${{ inputs.next_branch_other }}

  build-kernel-a13-5-10:
    uses: ./.github/workflows/build-kernel-a13-5.10.yml
    secrets: inherit
    if: ${{ inputs.build_a13_5_10 }}
    with:
      runner: ${{ inputs.runner }}
      lto_type: ${{ inputs.lto_type }}
      next_branch: ${{ inputs.next_branch }}
      next_branch_other: ${{ inputs.next_branch_other }}

  build-kernel-a13-5-15:
    uses: ./.github/workflows/build-kernel-a13-5.15.yml
    secrets: inherit
    if: ${{ inputs.build_a13_5_15 }}
    with:
      runner: ${{ inputs.runner }}
      lto_type: ${{ inputs.lto_type }}
      next_branch: ${{ inputs.next_branch }}
      next_branch_other: ${{ inputs.next_branch_other }}

  build-kernel-a14-5-15:
    uses: ./.github/workflows/build-kernel-a14-5.15.yml
    secrets: inherit
    if: ${{ inputs.build_a14_5_15 }}
    with:
      runner: ${{ inputs.runner }}
      lto_type: ${{ inputs.lto_type }}
      next_branch: ${{ inputs.next_branch }}
      next_branch_other: ${{ inputs.next_branch_other }}

  build-kernel-a14-6-1:
    uses: ./.github/workflows/build-kernel-a14-6.1.yml
    secrets: inherit
    if: ${{ inputs.build_a14_6_1 }}
    with:
      runner: ${{ inputs.runner }}
      lto_type: ${{ inputs.lto_type }}
      next_branch: ${{ inputs.next_branch }}
      next_branch_other: ${{ inputs.next_branch_other }}

  build-kernel-a16-6-6:
    uses: ./.github/workflows/build-kernel-a16-6.6.yml
    secrets: inherit
    if: ${{ inputs.build_a16_6_6 }}
    with:
      runner: ${{ inputs.runner }}
      lto_type: ${{ inputs.lto_type }}
      next_branch: ${{ inputs.next_branch }}
      next_branch_other: ${{ inputs.next_branch_other }}

  trigger-release:
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    needs:
        - build-kernel-a12-5-10
        - build-kernel-a13-5-10
        - build-kernel-a13-5-15
        - build-kernel-a14-5-15
        - build-kernel-a14-6-1
        - build-kernel-a16-6-6
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine Next Tag and Release Name
        id: tag_logic
        run: |
          git fetch --tags
          LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then
              LATEST_TAG="v1.0.0"
          fi

          BASE_VERSION=$(echo "$LATEST_TAG" | cut -d'.' -f1,2)
          PATCH_VERSION=$(echo "$LATEST_TAG" | cut -d'.' -f3)
          NEW_PATCH=$((PATCH_VERSION + 1))
          NEW_TAG="${BASE_VERSION}.${NEW_PATCH}"

          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "Generated New Tag: $NEW_TAG"

          RELEASE_NAME="GKI Kernel Release $NEW_TAG"
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV

          declare -A BRANCH_MAP=(
              ["gki_android12_5_10"]="gki-android12-5.10"
              ["gki_android13_5_10"]="gki-android13-5.10"
              ["gki_android13_5_15"]="gki-android13-5.15"
              ["gki_android14_5_15"]="gki-android14-5.15"
              ["gki_android14_6_1"]="gki-android14-6.1"
              ["gki_android16_6_6"]="gki-android16-6.6"
          )

          RELEASE_NOTES="### Automated GKI Kernel Build with KernelSU-Next & SUSFS Patches\n\n"
          RELEASE_NOTES+="This release contains automatically built kernels triggered by workflow dispatch.\n\n"
          RELEASE_NOTES+="#### Extracted Branch Versions used for SUSFS:\n"

          for folder in kernel-android*; do
              if [ -d "$folder" ]; then
                  CONFIG_NAME=$(echo "$folder" | sed 's/kernel-//')
                  AND_VER=$(echo "$CONFIG_NAME" | cut -d'-' -f1)
                  KER_VER=$(echo "$CONFIG_NAME" | cut -d'-' -f2)
                  MAP_KEY="gki_${AND_VER}_$(echo "$KER_VER" | tr '.' '_')"

                  MAPPED_BRANCH=${BRANCH_MAP[$MAP_KEY]}
                  if [ -z "$MAPPED_BRANCH" ]; then
                      MAPPED_BRANCH="gki-${AND_VER}-${KER_VER}"
                  fi

                  RELEASE_NOTES+="- **Configuration**: \`$CONFIG_NAME\` -> **SUSFS Branch**: \`$MAPPED_BRANCH\`\n"
              fi
          done

          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo -e "$RELEASE_NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          git tag $NEW_TAG
          git push origin $NEW_TAG

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded-artifacts

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.NEW_TAG }}
          prerelease: true
          release_name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_NOTES }}

      - name: Upload Release Assets Dynamically
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file in ./downloaded-artifacts/kernel-*/*; do
              if [ -d "$file" ]; then
                  continue
              fi
              echo "Uploading $file..."
              gh release upload ${{ env.NEW_TAG }} "$file"
          done

      - name: Display Files Uploaded
        run: |
          echo "GitHub release created with the following files:"
          ls ./downloaded-artifacts/**/*
